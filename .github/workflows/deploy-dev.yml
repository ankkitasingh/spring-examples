name: Deploy to EC2 (dev)

on:
  push:
    branches: ["dev"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODULE_DIR: .   # change if you deploy a subfolder

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show branch/commit info
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          git log --oneline -n 3 || true

      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/gha-ec2
          # strip any accidental CRLFs
          sed -i 's/\r$//' ~/.ssh/gha-ec2
          chmod 600 ~/.ssh/gha-ec2

          # quick sanity: can ssh-keygen read the private key?
          ssh-keygen -yf ~/.ssh/gha-ec2 >/dev/null || (echo "Invalid private key" && exit 1)

          # trust host and test connectivity
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/gha-ec2 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${{ secrets.EC2_USER }}"@"${{ secrets.EC2_HOST }}" "echo OK && hostname"

      - name: Ensure target dir on EC2
        run: |
          ssh -i ~/.ssh/gha-ec2 -o StrictHostKeyChecking=yes \
            "${{ secrets.EC2_USER }}"@"${{ secrets.EC2_HOST }}" \
            "mkdir -p '${{ secrets.EC2_TARGET_DIR }}' && ls -la '${{ secrets.EC2_TARGET_DIR }}'"

      - name: Rsync code to EC2 (exclude junk)
        run: |
          RSYNC_SSH="ssh -i ~/.ssh/gha-ec2 -o StrictHostKeyChecking=yes"
          rsync -avz --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.idea/' \
            --exclude '.metadata/' \
            --exclude '.gradle/' \
            --exclude 'target/' \
            -e "$RSYNC_SSH" \
            "${{ env.MODULE_DIR }}/" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_TARGET_DIR }}/"

      - name: Deploy on EC2 (build & restart)
        run: |
          ssh -i ~/.ssh/gha-ec2 -o StrictHostKeyChecking=yes \
            "${{ secrets.EC2_USER }}"@"${{ secrets.EC2_HOST }}" \
            "set -euo pipefail; \
             cd '${{ secrets.EC2_TARGET_DIR }}'; \
             if command -v docker-compose >/dev/null 2>&1; then DC='docker-compose'; else DC='docker compose'; fi; \
             echo '== Docker versions =='; docker --version; \$DC version; \
             echo '== Effective compose config =='; \$DC config; \
             echo '== Build app image =='; \$DC build --pull app; \
             echo '== Restart app service =='; \$DC up -d app; \
             echo '== Container status =='; \$DC ps; \
             echo '== Tail app logs (last 100 lines) =='; \$DC logs --tail=100 app || true; \
             echo '== Health check =='; (curl -fsS -m 10 http://localhost/actuator/health || true)"
