spring.application.name=securityy
# H2 console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# In-memory DB that stays up during app lifetime
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Silence JTA notice
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform


# JWT (demo key only — put a long, random value; store in env/secret manager in real apps)
jwt.secret=72a9a5ed4ee48e59b0f71b87ade63d0ae72b03312c90efba8acab4c7238dba95
jwt.expiration=3600000
